<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>tooktak - 시공 현장을 더 가볍게</title>
  <meta name="description" content="시공 기사와 인테리어 업체를 위한 현장 관리 PWA, tooktak. 시공 건 관리·푸시 알림·정산 추적을 한 화면에서." />

  <!-- canonical URL: 실제 배포 도메인 확정 시 교체 -->
  <!-- <link rel="canonical" href="https://tooktak-landing.example.com/" /> -->

  <!-- favicon: 실제 파비콘 추가 시 교체 -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="tooktak - 시공 현장을 더 가볍게" />
  <meta property="og:description" content="시공 기사와 인테리어 업체를 위한 현장 관리 PWA. 카톡·전화·수기장부 대신 한 화면 통합." />
  <meta property="og:image" content="assets/og-image-placeholder.svg" />
  <!-- og:url: 실제 배포 도메인 확정 시 교체 -->
  <!-- <meta property="og:url" content="https://tooktak-landing.example.com/" /> -->

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="tooktak - 시공 현장을 더 가볍게" />
  <meta name="twitter:description" content="시공 기사와 인테리어 업체를 위한 현장 관리 PWA." />
  <meta name="twitter:image" content="assets/og-image-placeholder.svg" />

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      /* 브랜드 블루 그라디언트 — 대문은 풀블리드로 랜딩(흰 배경)과 차별화 */
      background: linear-gradient(160deg, #3b82f6 0%, #2563eb 45%, #1d4ed8 100%);
      display: flex;
      flex-direction: column;
    }
    svg { display: block; }
    a { color: inherit; }

    :focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
      border-radius: 8px;
    }

    /* ===== 배경 장식 (은은한 광원) ===== */
    .gate {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      overflow: hidden;
    }
    .gate::before,
    .gate::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
      pointer-events: none;
    }
    .gate::before { width: 420px; height: 420px; top: -160px; right: -120px; }
    .gate::after  { width: 320px; height: 320px; bottom: -140px; left: -110px; }

    /* ===== 중앙 콘텐츠 ===== */
    .inner {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    /* 휴대폰 목업 */
    .gate-mockup {
      display: block;
      width: clamp(170px, 26vw, 240px);
      margin: 0 auto 24px;
      filter: drop-shadow(0 24px 50px rgba(15, 23, 42, 0.45));
    }

    .wordmark {
      font-size: clamp(2.6rem, 11vw, 4.4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0;
    }
    .tagline {
      margin: 18px 0 0;
      font-size: clamp(1.15rem, 4.6vw, 1.6rem);
      font-weight: 700;
    }
    .sub {
      margin: 14px 0 0;
      font-size: clamp(0.95rem, 3.6vw, 1.05rem);
      color: rgba(255, 255, 255, 0.82);
    }

    /* ===== 버튼 (대문 → 집/랜딩) ===== */
    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 36px;
      padding: 16px 34px;
      background: #ffffff;
      color: #1d4ed8;
      font-size: 1.05rem;
      font-weight: 800;
      text-decoration: none;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .enter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.34);
    }
    .enter-btn:active { transform: translateY(0); }
    .enter-btn svg { width: 18px; height: 18px; }

    /* ===== 진입 애니메이션 ===== */
    .reveal {
      opacity: 0;
      transform: translateY(16px);
      animation: rise 0.6s ease forwards;
    }
    .reveal.d1 { animation-delay: 0.08s; }
    .reveal.d2 { animation-delay: 0.20s; }
    .reveal.d3 { animation-delay: 0.30s; }
    .reveal.d4 { animation-delay: 0.42s; }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== 푸터 ===== */
    .gate-footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.66);
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; opacity: 1; transform: none; }
      .enter-btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="gate">
    <div class="inner">
      <img class="gate-mockup reveal d1"
           src="assets/mockup-placeholder.svg"
           alt="tooktak 앱 화면 미리보기"
           width="320" height="640"
           loading="eager" />
      <h1 class="wordmark reveal d2">tooktak</h1>
      <p class="tagline reveal d3">시공 현장을 더 가볍게</p>
      <p class="sub reveal d3">시공 기사와 인테리어 업체를 위한 현장 관리 앱</p>

      <a class="enter-btn reveal d4" href="home.html" aria-label="tooktak 소개 페이지 둘러보기">
        tooktak 둘러보기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="M13 6l6 6-6 6" />
        </svg>
      </a>
    </div>
  </main>

  <footer class="gate-footer">
    © <span id="year">2026</span> tooktak
  </footer>

  <script>
    (function () {
      "use strict";
      var y = document.getElementById("year");
      if (y) { y.textContent = new Date().getFullYear(); }
    })();
  </script>
</body>
</html>
